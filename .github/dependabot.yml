version: 2

# Dependency updates, opened as pull requests against `main`.
#
# Grouped so a week of patch bumps arrives as one reviewable PR instead of nine,
# and so the security story stays legible: a grouped patch PR is easy to merge, a
# single major bump is easy to think about.
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: uv
    directory: /modal_app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # The workflow itself is a dependency: an outdated actions/checkout is how a
  # private token ends up in a log.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
