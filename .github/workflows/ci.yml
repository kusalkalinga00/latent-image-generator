name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here touches Modal or Vercel credentials: the web checks are static, and
# the Python job installs the locked dev group and runs ruff/pytest without a Modal
# login or a GPU. A pull request from a fork must be safe to run.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          # Read the version from package.json's packageManager field, so it lives in
          # one place. The action looks at the repo root by default, and this
          # package.json is in web/ - without this it fails with "No pnpm version
          # is specified".
          package_json_file: web/package.json
          run_install: false

      - uses: actions/setup-node@v4
        with:
          # Matches web/package.json's `engines: node >= 22`, and what Vercel builds on.
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # --frozen-lockfile, because a CI that silently updates the lockfile is not
      # checking the lockfile.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

      # routeTree.gen.ts is generated and committed. The generator writes the
      # routes and the Start build plugin adds the SSR registration, so run both
      # and fail if the committed tree differs.
      - run: pnpm generate-routes
      - run: pnpm build
      - run: git diff --exit-code

  python:
    name: python — lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --frozen proves the lockfile is current; the dev group brings pytest and
      # ruff. Nothing here imports torch or contacts Modal.
      - run: uv sync --all-packages --group dev --frozen
      - run: uv run ruff check modal_app scripts
      - run: uv run mypy
      - run: uv run pytest

  secrets:
    name: secrets — gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so a secret removed in a later commit is still caught.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
