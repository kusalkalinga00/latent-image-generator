name: web-ci

# The app lives in web/, so the filters keep this from running on changes that
# cannot affect it - the Modal service and the docs, for instance.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

# Every step below assumes it is standing in web/. The alternative is prefixing
# each command with the path, which is easier to get subtly wrong.
defaults:
  run:
    working-directory: web

jobs:
  build:
    name: typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          # Matches the runtime Vercel is configured to build with, so CI and the
          # deploy agree on the Node version.
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # --frozen-lockfile, so CI fails on a lockfile that is out of sync rather
      # than silently resolving something different from what ships.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The route tree is generated, and it is git-ignored. Typecheck needs it to
      # exist: without this, tsc reports every route as missing.
      - name: Generate the route tree
        run: pnpm generate-routes

      # These two catch things `build` does not. Vite transpiles without
      # typechecking, so a type error is invisible to a build that succeeds.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
