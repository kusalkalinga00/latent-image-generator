[project]
name = "modal-app"
version = "0.1.0"
description = "Modal GPU service for image editing and text-to-image: Qwen-Image-Edit-2511 and Qwen-Image-2512, JSON API only."
readme = "README.md"
authors = [
    { name = "Kusal", email = "kusalkalingainfo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.3",
    "pillow>=11.0.0",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
