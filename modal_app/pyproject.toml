[project]
name = "modal-app"
version = "0.1.0"
description = "Modal GPU service for image generation and editing: Qwen-Image-2.1 with a 4-step Lightning LoRA, JSON API only."
readme = "README.md"
authors = [
    { name = "Kusal", email = "kusalkalingainfo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.3",
    "pillow>=11.0.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
