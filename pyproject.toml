[project]
name = "image-editor"
version = "0.1.0"
description = "Qwen-Image-2.1 hosted on Modal — private, on-demand, scale-to-zero image generation and editing."
readme = "README.md"
authors = [
    { name = "Kusal", email = "kusalkalingainfo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["modal_app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
# torch/diffusers are only in the Modal image, not the local venv.
ignore_missing_imports = true
files = ["modal_app/src"]

[tool.uv.workspace]
members = [
    "modal_app",
]

[tool.uv.sources]
modal-app = { workspace = true }
